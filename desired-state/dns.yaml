---
apiVersion: npmctl.com/v1
schemaVersion: 2
dns_records:
  - provider: namecheap
    zone: ssot-registry.com
    type: A
    name: "@"
    value: __SITE_SERVER_IP__
    ttl: 300
    meta:
      managed_by: npmctl
      owner: ssot-registry-com
      resource_id: dns.ssot-registry-com.root-a
  - provider: namecheap
    zone: ssot-registry.com
    type: A
    name: "*"
    value: __SITE_SERVER_IP__
    ttl: 300
    meta:
      managed_by: npmctl
      owner: ssot-registry-com
      resource_id: dns.ssot-registry-com.wildcard-a
  - provider: namecheap
    zone: ssot-registry.com
    type: CNAME
    name: "www"
    value: ssot-registry.com
    ttl: 300
    meta:
      managed_by: npmctl
      owner: ssot-registry-com
      resource_id: dns.ssot-registry-com.www-cname
