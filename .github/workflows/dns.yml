name: DNS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: plan or apply
        required: true
        default: plan

concurrency:
  group: dns-ssot-registry.com
  cancel-in-progress: false

jobs:
  dns:
    runs-on: deployment
    env:
      NPM_BASE_URL: ${{ secrets.NPM_BASE_URL }}
      NPM_IDENTITY: ${{ secrets.NPM_IDENTITY }}
      NPM_SECRET: ${{ secrets.NPM_SECRET || secrets.NPM_PASSWORD || secrets.NGINX_PROXY_MANAGER_SECRET }}
      NPM_TIMEOUT_S: 30
      NAMECHEAP_API_USER: ${{ secrets.NAMECHEAP_API_USER }}
      NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
      NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
      NAMECHEAP_CLIENT_IP: ${{ secrets.NAMECHEAP_CLIENT_IP }}
      SITE_SERVER_IP: ${{ secrets.SITE_SERVER_IP || secrets.SERVER_IP || secrets.DEPLOY_SERVER_IP }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install npmctl from PyPI
        run: python -m pip install --upgrade "npmctl>=0.3.8" "npmctl-namecheap>=0.3.8"
      - name: Render DNS desired state from secrets
        run: |
          test -n "$SITE_SERVER_IP"
          mkdir -p .generated/desired-state
          python - <<'PY'
          import os
          from pathlib import Path

          source = Path("desired-state/dns.yaml")
          target = Path(".generated/desired-state/dns.yaml")
          target.write_text(
              source.read_text(encoding="utf-8").replace(
                  "SITE_SERVER_IP",
                  os.environ["SITE_SERVER_IP"],
              ),
              encoding="utf-8",
          )
          PY
      - name: Validate desired DNS state
        run: npmctl validate .generated/desired-state/dns.yaml
      - name: Validate Namecheap provider
        run: npmctl dns doctor --provider namecheap
      - name: Normalize Namecheap DNS records
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: python scripts/namecheap-normalize-dns.py .tmp/dns.yaml
      - name: Plan Namecheap DNS with npmctl
        if: ${{ github.event.inputs.mode != 'apply' }}
        run: npmctl plan .generated/desired-state/dns.yaml --owner ssot-registry-com
      - name: Apply Namecheap DNS with npmctl
        continue-on-error: true
        run: npmctl apply .generated/desired-state/dns.yaml --owner ssot-registry-com
