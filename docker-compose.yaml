services:
  ssot-registry-com:
    build: .
    container_name: ssot-registry-com
    restart: unless-stopped
    labels:
      site.host: ssot-registry.com
      site.kind: mdwrk-lander
    expose:
      - "80"
    networks:
      dockerwp:
        aliases:
          - ssot-registry-com

networks:
  dockerwp:
    name: dockerwp
    external: true
