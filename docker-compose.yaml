services:
  ssot-registry-com:
    build: .
    container_name: ssot-registry-com
    restart: unless-stopped
    labels:
      site.host: ssot-registry.com
      site.kind: product-portfolio
    expose:
      - "80"
    networks:
      ssot-registry-com-private: {}
      portwyrm-edge:
        aliases:
          - ssot-registry-com

networks:
  ssot-registry-com-private:
    name: ssot-registry-com-private
    internal: true
  portwyrm-edge:
    name: portwyrm-edge
    external: true
